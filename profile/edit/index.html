<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bidly — Edit Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link href="../../dist/css/style.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Share+Tech&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="../../src/js/index.js" defer type="module"></script>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg pb-lg-3">
            <div class="container">

                <!-- logo -->
                <a class="navbar-brand" href="/index.html">
                    <svg width="90" height="32" viewBox="0 0 90 32" fill="none" xmlns="http://www.w3.org/2000/svg"
                        aria-label="Bidly">
                        <text x="0" y="26" fill="#198754" font-size="26" font-weight="700"
                            font-family="'Share Tech', sans-serif" letter-spacing="2">BIDLY</text>
                    </svg>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <!-- left links -->
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link me-3" href="/index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link me-3" href="/profiles/index.html">Profiles</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link me-3" href="/posts/index.html">Listings</a>
                        </li>
                    </ul>

                    <!-- logged out -->
                    <div class="nav-auth d-flex align-items-center gap-2">
                        <a class="nav-link me-2 login-link" href="/profile/login/index.html">Login</a>
                        <a class="btn-register" href="/profile/register/index.html">Register</a>
                    </div>

                    <!-- logged in -->
                    <a class="logout-btn btn btn-dark nav-link me-3 p-2" href="">Logout</a>
                    <div class="logging-status menu-container"></div>

                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container py-5">
            <div class="auth-card" style="max-width:500px">
                <h1 class="auth-title">Edit Profile</h1>
                <p class="auth-sub">Update your avatar or banner</p>

                <form id="editProfile" class="auth-form">
                    <div class="auth-field">
                        <label for="name">Username</label>
                        <input class="form-control" id="name" type="text" name="name" disabled>
                    </div>
                    <div class="auth-field">
                        <label for="email">Email</label>
                        <input class="form-control" id="email" type="email" name="email" disabled>
                    </div>
                    <div class="auth-field">
                        <label for="bio">Bio <span class="auth-optional">optional</span></label>
                        <textarea class="form-control" id="bio" name="bio" rows="2"
                            placeholder="Tell something about yourself..."
                            style="background:#111;border:1px solid #2a2a2a;color:#d4d4d4;border-radius:4px;padding:10px 14px;font-size:14px;resize:vertical"></textarea>
                    </div>
                    <div class="auth-field">
                        <label for="avatar">Avatar URL <span class="auth-optional">optional</span></label>
                        <input class="form-control" id="avatar" type="url" name="avatar" placeholder="https://...">
                    </div>
                    <div class="auth-field">
                        <label for="banner">Banner URL <span class="auth-optional">optional</span></label>
                        <input class="form-control" id="banner" type="url" name="banner" placeholder="https://...">
                    </div>
                    <button type="submit" class="auth-submit">Update Profile</button>
                    <div class="message-container mt-3"></div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <nav class="navbar fixed-bottom" style="background:#111;border-top:1px solid #1e1e1e">
            <div class="container-fluid justify-content-between">
                <a class="navbar-brand" href="/index.html">
                    <svg width="70" height="24" viewBox="0 0 90 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <text x="0" y="26" fill="#198754" font-size="26" font-weight="700"
                            font-family="'Share Tech', sans-serif" letter-spacing="2">BIDLY</text>
                    </svg>
                </a>
                <span style="color:#888;font-size:0.8rem">Bidly © 2026</span>
            </div>
        </nav>
    </footer>

</body>

</html>
